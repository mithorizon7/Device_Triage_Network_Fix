name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify Hosting Runtime Bootstrap
        run: bash scripts/replit-runtime.sh prepare
      - name: Dependency Audit
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Format Check
        run: npm run format:check
      - name: i18n Lint
        run: npm run lint:i18n
      - name: Type Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
